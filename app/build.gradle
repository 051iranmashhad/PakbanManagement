plugins {
    id 'com.android.application'
    id 'kotlin-parcelize'
    id 'dagger.hilt.android.plugin'
    id 'com.google.devtools.ksp'
}

def jvmTarget = 17
def appName = "PakbanManagement"

android {
    namespace 'ir.pakbanmanagement'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "ir.pakbanmanagement"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        resourceConfigurations += ['en', 'fa']
        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField("String", "BASE_URL", "\"https://172.16.9.68\"")

        base.setArchivesName("${appName}_vc${versionCode}_vn${versionName}")
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            minifyEnabled true
            shrinkResources true
        }
    }

    kotlin {
        jvmToolchain(jvmTarget)
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    lint {
        disable 'SetTextI18n'
        disable 'NotifyDataSetChanged'
        disable 'SetJavaScriptEnabled'
        disable 'SimpleDateFormat'
        disable 'MissingPermission'
        disable 'MissingSuperCall'
        disable 'Deprecated'
        disable 'TypographyFractions'
        disable 'TypographyQuotes'
        disable 'InternalInsetResource'
        disable 'KotlinConstantConditions'

        abortOnError false
        warningsAsErrors false
    }
}

dependencies {
    // kotlin
    implementation 'androidx.core:core-ktx:1.17.0'

    // view
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"
    implementation 'com.google.android.material:material:1.13.0'

    implementation 'com.github.kshitijskumar:Ticker:1.0.0'
    implementation 'id.zelory:compressor:3.0.1'

    implementation 'com.github.bumptech.glide:glide:5.0.5'
    ksp 'com.github.bumptech.glide:compiler:5.0.5'

    // ssp & sdp
    implementation 'com.intuit.sdp:sdp-android:1.1.1'
    implementation 'com.intuit.ssp:ssp-android:1.1.1'

    // activity & fragment
    implementation 'androidx.activity:activity-ktx:1.12.4'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'

    // view model
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'

    // dagger hilt
    implementation 'com.google.dagger:hilt-android:2.59.1'
    ksp 'com.google.dagger:hilt-compiler:2.59.1'

    // auth
    implementation 'com.google.android.gms:play-services-auth:21.5.1'

    // gson
    implementation 'com.google.code.gson:gson:2.13.2'

    // coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // preferences dataStore
    implementation 'androidx.datastore:datastore-preferences:1.2.0'

    // osm
    implementation 'org.osmdroid:osmdroid-android:6.1.20'

    // permission
    implementation 'com.karumi:dexter:6.2.3'

    // location
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // test
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
